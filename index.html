<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14110f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Waves" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Waves</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14110f; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; inset: 0; }
      #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
      #safe { position: fixed; visibility: hidden; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; background: #14110f; color: #c9c2a8; font: bold 16px/1.4 ui-monospace, Menlo, monospace; text-align: center; letter-spacing: 1px; z-index: 10; }
      #rotate .phone { width: 44px; height: 80px; border: 4px solid #8ea06c; border-radius: 6px; animation: turn 1.6s steps(4) infinite; }
      @keyframes turn { 0%, 40% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="safe"></div>
    <div id="rotate"><div class="phone"></div><div>TOURNE TON TÉLÉPHONE<br />EN MODE PAYSAGE</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
